<!--__SCRIPT__-->
<script>
/* 锚点高亮与表单反馈。云端写入由独立脚本接管。 */
(function(){
  var links=[].slice.call(document.querySelectorAll('.nav-link'));
  function mark(){
    var best=null, top=180;
    links.forEach(function(a){
      var id=a.getAttribute('href').replace('#','');
      var el=document.getElementById(id);
      if(el && el.getBoundingClientRect().top<=top) best=a;
    });
    links.forEach(function(a){a.classList.toggle('is-on',a===best);});
  }
  window.addEventListener('scroll',mark,{passive:true}); mark();
  var form=document.getElementById('leadForm');
  if(form && !window.leadCloudEnabled){
    form.addEventListener('submit',function(e){
      e.preventDefault();
      var box=document.getElementById('leadStatus');
      if(box){box.hidden=false;box.className='status is-warn';
        box.textContent='演示页面未接后端，这条信息没有发送，也不会保存。';}
    });
  }
})();
</script>
</body>
</html>
