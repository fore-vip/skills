<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--__HEAD__-->
<style>
:root{--bg:#0b0b0f;--card:#171720;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.16);
  --text:#f3f3f6;--sub:#c6c6d0;--muted:#8b8b99;--brand:#e53e3e;--brand-soft:#ff7a7a;
  --warn:#fbbf24;--ok:#4ade80;--r:16px;--r-sm:10px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{width:min(1080px,calc(100% - 40px));margin:0 auto}
header{position:sticky;top:0;z-index:20;background:rgba(11,11,15,.86);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hd-in{display:flex;align-items:center;justify-content:space-between;gap:14px;height:60px}
.hd-logo{font-size:15px;font-weight:600;letter-spacing:.04em}
.hd-cta{border:1px solid var(--line-2);border-radius:999px;padding:7px 15px;font-size:13px;color:var(--sub)}
.hero{position:relative;overflow:hidden;padding:78px 0 66px;text-align:center}
.glow{position:absolute;left:50%;top:-190px;width:780px;height:430px;transform:translateX(-50%);
  background:radial-gradient(ellipse at center,rgba(229,62,62,.20),rgba(229,62,62,0) 68%);
  pointer-events:none;z-index:0}
.hero .wrap{position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);
  border:1px solid var(--line);border-radius:999px;padding:5px 14px;margin-bottom:22px}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--brand)}
h1{font-size:clamp(30px,5.2vw,52px);line-height:1.3;font-weight:650;margin:0 0 18px;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--brand-soft)}
.hero-p{color:var(--sub);font-size:15.5px;max-width:680px;margin:0 auto 28px}
.hero-btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 22px;font-size:14px;font-weight:500}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-p{background:var(--brand);color:#fff}
.btn-g{border:1px solid var(--line-2);color:var(--sub)}
.sec{padding:34px 0 72px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:999px;padding:5px;width:fit-content;margin:0 auto 28px}
.tab{border:0;background:transparent;color:var(--muted);font-size:14px;padding:9px 22px;
  border-radius:999px;cursor:pointer;font-family:inherit}
.tab.on{background:var(--brand);color:#fff}
.blk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:16px}
.blk h3{font-size:18px;font-weight:600;margin:0 0 10px}
.blk p{color:var(--sub);font-size:14.5px;margin:8px 0}
.note{border-left:3px solid var(--warn);background:rgba(251,191,36,.07);border-radius:var(--r-sm);
  padding:14px 16px;margin:10px 0}
.note.ok{border-left-color:var(--ok);background:rgba(74,222,128,.06)}
.note p{margin:0;font-size:14px}
.lnk{display:inline-flex;align-items:center;gap:6px;color:var(--brand-soft);font-size:13.5px;margin-top:10px}
.lnk svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{border:1px solid var(--line-2);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--sub)}
.tl{margin-top:14px}
.tl-i{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.tl-i:last-child{border-bottom:0}
.tl-i .k{flex:0 0 28px;height:28px;border-radius:50%;background:rgba(229,62,62,.14);
  color:var(--brand-soft);font-size:13px;display:grid;place-items:center}
.tl-i h4{margin:0;font-size:14.5px;font-weight:600}
.tl-i p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:500;font-size:12.5px}
.tbl td{color:var(--sub)}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;white-space:nowrap}
.badge.a{border:1px solid rgba(74,222,128,.35);color:var(--ok)}
.badge.b{border:1px solid rgba(251,191,36,.35);color:var(--warn)}
.badge.c{border:1px solid rgba(229,62,62,.4);color:var(--brand-soft)}
.arts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.art{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px}
.art h4{margin:0 0 5px;font-size:14px;font-weight:600}
.art p{margin:0;font-size:12.5px;color:var(--muted)}
.demo{background:linear-gradient(180deg,#171720,#111119);border:1px solid var(--line-2);
  border-radius:var(--r);padding:22px;margin-bottom:18px;text-align:left}
.d-bar{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;
  padding-bottom:18px;border-bottom:1px solid var(--line)}
.d-bar h3{font-size:19px;font-weight:600;margin:0}
.d-bar p{color:var(--muted);font-size:12.5px;margin:3px 0 0}
.d-picks{display:flex;flex-wrap:wrap;gap:8px}
.d-switch{display:flex;gap:4px;background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:999px;padding:4px}
.d-switch button{border:0;background:transparent;color:var(--sub);font-size:12.5px;
  padding:6px 12px;border-radius:999px;cursor:pointer;font-family:inherit}
.d-switch button.on{background:var(--brand);color:#fff}
.d-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.d-kpi{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px}
.d-kpi b{display:block;font-size:22px;font-weight:600}
.d-kpi span{color:var(--muted);font-size:12px}
.d-chart,.d-todo,.d-ask{margin-top:22px}
.d-chart h4,.d-todo h4,.d-ask h4{font-size:14.5px;font-weight:600;margin:0}
.d-bars{display:flex;align-items:flex-end;gap:8px;height:118px;margin-top:14px;border-bottom:1px solid var(--line)}
.d-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.d-col i{display:block;width:100%;max-width:34px;border-radius:5px 5px 0 0;
  background:linear-gradient(180deg,var(--brand-soft),rgba(229,62,62,.18))}
.d-col span{font-size:10.5px;color:var(--muted);white-space:nowrap}
.d-hint{color:var(--muted);font-size:12px;margin-top:8px}
.d-todo h4 span{color:var(--brand-soft);font-size:12px;font-weight:400;margin-left:8px}
.d-task{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin-top:9px}
.d-task.done{opacity:.55}
.d-task-t{font-size:14px;font-weight:500;flex:1;min-width:180px}
.d-task-d{color:var(--muted);font-size:12px;flex-basis:100%;order:3}
.d-tag{font-size:11px;color:var(--warn);border:1px solid rgba(251,191,36,.32);border-radius:999px;padding:2px 9px;white-space:nowrap}
.d-acts{display:flex;gap:6px;order:2}
.d-acts button{border:1px solid var(--line-2);background:transparent;color:var(--sub);font-size:12px;
  padding:5px 11px;border-radius:8px;cursor:pointer;font-family:inherit}
.d-acts button.go{border-color:var(--brand);color:var(--brand-soft)}
.d-state{font-size:12px;color:var(--ok);order:2;white-space:nowrap}
.d-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.d-chips button{border:1px solid var(--line-2);background:rgba(255,255,255,.035);color:var(--text);
  font-size:12.5px;padding:7px 12px;border-radius:999px;cursor:pointer;font-family:inherit}
.d-input{display:flex;gap:8px;margin-top:12px}
.d-input input{flex:1;min-width:0;background:rgba(0,0,0,.28);border:1px solid var(--line-2);
  border-radius:10px;color:var(--text);font-size:13.5px;padding:10px 13px;font-family:inherit;outline:none}
.d-input input:focus{border-color:var(--brand)}
.d-input button{border:0;background:var(--brand);color:#fff;font-size:13px;font-weight:500;
  padding:0 18px;border-radius:10px;cursor:pointer;font-family:inherit;white-space:nowrap}
.d-reply{margin-top:12px;background:rgba(229,62,62,.07);border:1px solid rgba(229,62,62,.24);
  border-radius:var(--r-sm);padding:13px 15px;font-size:13px;line-height:1.8;white-space:pre-line}
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted);font-size:13px}
.f-in{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between}
.f-links{display:flex;flex-wrap:wrap;gap:8px 18px}
.f-links a{color:var(--sub)}
@media(max-width:720px){
  .wrap{width:calc(100% - 32px)}
  .hero{padding:54px 0 46px}
  .hd-in{height:54px}
  .blk{padding:18px}
  .d-demo,.demo{padding:16px}
  .d-kpis{grid-template-columns:repeat(2,1fr)}
  .d-bar{align-items:flex-start;flex-direction:column}
  .d-col span{font-size:9px}
  .d-task-t{min-width:100%}
  .d-acts{margin-top:2px}
  .arts{grid-template-columns:repeat(2,1fr)}
  .tbl th,.tbl td{padding:9px 6px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.glow{display:none}}
</style>
</head>
<body>
<header><div class="wrap hd-in">
  <div class="hd-logo">__BRAND__</div>
  <a class="hd-cta" href="#tabs">__HERO_CTA__</a>
</div></header>
<main>
<!--__HERO__-->
<!--__SECTION__-->
</main>
<footer><div class="wrap f-in">
  <span>__BRAND__ · 示例数据原型</span>
  <div class="f-links">__FOOTER_LINKS__</div>
</div></footer>
<!--__SCRIPT__-->
<script>
(function(){
  var tabs=[].slice.call(document.querySelectorAll('.tab'));
  var panels={};
  tabs.forEach(function(t){panels[t.getAttribute('data-k')]=document.getElementById('panel-'+t.getAttribute('data-k'));});
  function show(k,push){
    tabs.forEach(function(t){
      var on=t.getAttribute('data-k')===k;
      t.classList.toggle('on',on);
      t.setAttribute('aria-selected',on?'true':'false');
      if(panels[t.getAttribute('data-k')])panels[t.getAttribute('data-k')].hidden=!on;
    });
    if(push && location.hash!=='#'+k){try{history.replaceState(null,'','#'+k);}catch(_){location.hash=k;}}
  }
  tabs.forEach(function(t){t.addEventListener('click',function(){show(t.getAttribute('data-k'),true);});});
  function fromHash(){
    var k=location.hash.replace('#','');
    show(panels[k]?k:tabs[0].getAttribute('data-k'),false);
  }
  window.addEventListener('hashchange',fromHash);
  fromHash();
})();
</script>
</body>
</html>
